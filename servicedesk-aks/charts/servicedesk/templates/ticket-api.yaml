apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  {{- if not .Values.ticketApi.hpa.enabled }}
  replicas: {{ .Values.ticketApi.replicas }}
  {{- end }}
  selector: { matchLabels: { app: ticket-api } }
  template:
    metadata:
      labels: { app: ticket-api, azure.workload.identity/use: "true" }
    spec:
      {{- include "sd.podSpecCommon" . | nindent 6 }}
      containers:
        - name: ticket-api
          image: {{ include "sd.image" (dict "root" . "name" "ticket-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [ { containerPort: 8080 } ]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources: {{- toYaml .Values.ticketApi.resources | nindent 12 }}
          {{- include "sd.containerSecurity" . | nindent 10 }}
          {{- include "sd.kvMount" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-api
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  selector: { app: ticket-api }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]
{{- if .Values.ticketApi.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticket-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ticket-api }
  minReplicas: {{ .Values.ticketApi.hpa.minReplicas }}
  maxReplicas: {{ .Values.ticketApi.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.ticketApi.hpa.cpu }} } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticket-api
spec:
  minAvailable: 1
  selector: { matchLabels: { app: ticket-api } }
{{- end }}
