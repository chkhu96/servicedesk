# Pulls secrets + TLS cert from Key Vault using workload identity.
# secretObjects syncs the cert into a kubernetes.io/tls Secret for the Gateway listener
# (sync only happens while at least one pod mounts this SecretProviderClass).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: servicedesk-kv
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
        - |
          objectName: sla-config
          objectType: secret
        - |
          objectName: {{ .Values.gateway.kvCertName }}
          objectType: secret
          objectAlias: tls-bundle
  secretObjects:
    - secretName: {{ .Values.gateway.tlsSecretName }}
      type: kubernetes.io/tls
      data:
        - objectName: tls-bundle
          key: tls.key
        - objectName: tls-bundle
          key: tls.crt
