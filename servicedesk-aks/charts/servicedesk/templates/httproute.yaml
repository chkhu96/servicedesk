apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: servicedesk
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: servicedesk-gw
      sectionName: https
  hostnames: [ {{ .Values.gateway.hostname | quote }} ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /api/tickets } } ]
      backendRefs: [ { name: ticket-api, port: 80 } ]
    - matches: [ { path: { type: PathPrefix, value: /api/reports } } ]
      backendRefs:
        - name: report-api-{{ .Values.reportApi.version }}
          port: 80
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      backendRefs: [ { name: web, port: 80 } ]
