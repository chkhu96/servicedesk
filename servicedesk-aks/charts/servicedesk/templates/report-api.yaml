apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api-{{ .Values.reportApi.version }}
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reportApi.replicas }}
  selector: { matchLabels: { app: report-api, version: {{ .Values.reportApi.version }} } }
  template:
    metadata:
      labels: { app: report-api, version: {{ .Values.reportApi.version }}, azure.workload.identity/use: "true" }
    spec:
      {{- include "sd.podSpecCommon" . | nindent 6 }}
      containers:
        - name: report-api
          image: {{ include "sd.image" (dict "root" . "name" "report-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: [ { name: APP_VERSION, value: {{ .Values.reportApi.version | quote }} } ]
          ports: [ { containerPort: 8080 } ]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources: {{- toYaml .Values.reportApi.resources | nindent 12 }}
          {{- include "sd.containerSecurity" . | nindent 10 }}
          {{- include "sd.kvMount" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-api-{{ .Values.reportApi.version }}
  labels: {{- include "sd.labels" . | nindent 4 }}
spec:
  selector: { app: report-api, version: {{ .Values.reportApi.version }} }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]
