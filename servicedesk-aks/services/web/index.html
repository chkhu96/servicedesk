<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticketing Lite</title>
<style>
  body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#1b1f24}
  header{background:#0f4c81;color:#fff;padding:14px 24px}
  main{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;gap:16px}
  .card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi b{display:block;font-size:26px}
  table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e5e8ec;text-align:left;font-size:14px}
  .breach{color:#b00020;font-weight:600}
  input,select,button{padding:6px 8px;font:inherit}
  form{display:flex;gap:8px;flex-wrap:wrap}
  small{color:#5b6570}
</style>
</head>
<body>
<header><h2 style="margin:0">Ticketing Lite</h2><small style="color:#cfe0f1" id="ver"></small></header>
<main>
  <section class="card"><h3>Dashboard</h3><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h3>New ticket</h3>
    <form id="f">
      <input id="t" placeholder="Title" required style="flex:2">
      <input id="d" placeholder="Description" style="flex:3">
      <select id="p"><option>P1</option><option>P2</option><option selected>P3</option><option>P4</option></select>
      <button>Create</button>
    </form>
  </section>
  <section class="card"><h3>Tickets</h3>
    <table><thead><tr><th>#</th><th>Title</th><th>Priority</th><th>Status</th><th>Assignee</th><th>Created (UTC)</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  </section>
</main>
<script>
const api = (p, o={}) => fetch(p, {headers:{'Content-Type':'application/json'}, ...o}).then(r => r.json());
async function load(){
  const s = await api('/api/reports/summary');
  document.getElementById('ver').textContent = 'report-api ' + s.version;
  const open = s.byStatus.filter(x=>['Open','InProgress'].includes(x.Status)).reduce((a,b)=>a+b.Count,0);
  document.getElementById('kpis').innerHTML = [
    ['Open tickets', open], ['SLA breaches (open)', s.openSlaBreaches],
    ['MTTR (hours)', s.meanTimeToResolveHours ?? '-'],
    ...s.openByPriority.map(x=>[x.Priority+' open', x.Count])
  ].map(([k,v])=>`<div class="kpi">${k}<b>${v}</b></div>`).join('');
  const t = await api('/api/tickets');
  document.getElementById('rows').innerHTML = t.map(x=>`<tr>
    <td>${x.Id}</td><td>${x.Title}${x.SlaBreached?' <span class="breach">SLA</span>':''}</td>
    <td>${x.Priority}</td><td>${x.Status}</td><td>${x.Assignee??'-'}</td>
    <td>${String(x.CreatedAt).replace('T',' ').slice(0,16)}</td>
    <td>${x.Status!=='Resolved'?`<button onclick="resolve(${x.Id})">Resolve</button>`:''}</td></tr>`).join('');
}
async function resolve(id){ await api('/api/tickets/'+id,{method:'PATCH',body:JSON.stringify({status:'Resolved'})}); load(); }
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  await api('/api/tickets',{method:'POST',body:JSON.stringify({title:t.value,description:d.value,priority:p.value})});
  e.target.reset(); load();
});
load();
</script>
</body>
</html>
